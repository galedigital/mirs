<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול מירס</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#EAF6F6;--ink:#1E293B;--soft:#41556B;--card:#fff;--line:#C5E0DF;--dark:#0B4F50;--safety:#F59E0B;--red:#D64535;--green:#2E9E5B;--teal:#008080}
@media (prefers-color-scheme:dark){:root{--page:#08191B;--ink:#E3EFEF;--soft:#9DB7B9;--card:#10292C;--line:#1F4447}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Assistant","Arial Hebrew",Arial,sans-serif;padding:20px 16px 110px}
h1{margin:0 0 4px;font-size:1.6rem;font-weight:900;text-align:center}
h1 em{font-style:normal;color:var(--safety)}
h1{color:var(--teal)}
.city{display:block;width:max-content;margin:0 auto 8px;padding:4px 14px;border-radius:99px;background:var(--teal);color:#fff;font-size:.8rem;font-weight:700}
.sub{text-align:center;color:var(--soft);margin:0 0 20px;font-size:.9rem}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--soft);margin-bottom:4px}
input{font:inherit;font-size:1rem;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input.code{direction:ltr;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.06em}
input.code:placeholder-shown{direction:rtl;font-family:inherit;font-size:.9rem;letter-spacing:0}
button{font:inherit;font-weight:700;font-size:.88rem;border:0;border-radius:99px;padding:8px 14px;cursor:pointer;background:var(--dark);color:#fff}
button.y{background:var(--safety);color:#1A1400}
button.g{background:var(--green)}
button.r{background:transparent;color:var(--red);border:1px solid var(--red)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:end}
.row>div{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hubl{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;color:var(--ink);cursor:pointer}
.hubl input{width:20px;height:20px;accent-color:#008080}
.hint{font-size:.8rem;color:var(--soft);margin:6px 0 0}
.warn{color:var(--red)}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:center;align-items:center}
#msg{font-size:.88rem;min-height:1.2em}
.err{color:var(--red)}.ok{color:var(--green)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <img src="eilat-logo.png" alt="עיריית אילת" width="150" height="73" style="display:block;margin:0 auto 10px;height:56px;width:auto">
  <h1>מירס<em>.</em> ניהול</h1>
  <p class="sub">קודים למחלקות. כל קוד מחבר עובדים לערוץ של המחלקה שלו.</p>

  <form class="card" id="login">
    <label for="pw">סיסמת מנהל</label>
    <div class="row"><div><input id="pw" type="password" autocomplete="current-password" required></div><button class="y" type="submit">כניסה</button></div>
    <p class="hint" id="loginMsg" role="status"></p>
  </form>

  <div id="panel" hidden>
    <div id="list"></div>
    <button class="g" type="button" id="add">➕ הוספת מחלקה</button>
    <p class="hint">החלפת קוד מנתקת מיד את מי שמשתמש בקוד הישן. אחרי כל שינוי לוחצים "שמירה".</p>
  </div>
</div>
<div class="bar" id="bar" hidden>
  <span id="msg" role="status"></span>
  <button class="y" type="button" id="save">💾 שמירה</button>
  <button type="button" id="logout">יציאה</button>
</div>

<script>
const API="/api/depts", $=id=>document.getElementById(id);
let pw="", depts=[], dirty=false;
try{pw=sessionStorage.getItem("mirs-admin")||""}catch(e){}

const ERR={locked:"יותר מדי ניסיונות שגויים. נסו שוב בעוד 15 דקות.",auth:"סיסמה שגויה.","no-admin":"עוד לא הוגדרה סיסמת מנהל ב-Cloudflare (ADMIN_PASSWORD).","no-kv":"עוד לא חובר מאגר הנתונים MIRS ב-Cloudflare.",name:"לכל מחלקה צריך שם.",short:"קוד קצר מדי (לפחות 6 תווים)",dup:"אותו קוד מופיע פעמיים",nocode:"חסר קוד",bad:"שגיאה בבקשה."};
async function call(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-admin":pw},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({ok:false,error:"http"+r.status}));
  if(!j.ok)throw new Error((ERR[j.error]||"שגיאה ["+(j.error||r.status)+(j.detail?": "+j.detail:"")+"]")+(j.n?" ("+j.n+")":""));
  return j;
}
const pretty=c=>{c=String(c||"");return /^\d{10}$/.test(c)?c.slice(0,5)+"-"+c.slice(5):c};
const newCode=()=>{const r=crypto.getRandomValues(new Uint8Array(10));let s=String(1+r[0]%9);for(let i=1;i<10;i++)s+=r[i]%10;return s};
const shareText=d=>"קוד מירס למחלקת "+d.n+": "+pretty(d.code)+"\n"+location.origin;
function setMsg(t,cls){$("msg").textContent=t;$("msg").className=cls||""}
function mark(){dirty=true;setMsg("יש שינויים שלא נשמרו","err")}

function render(){
  const L=$("list");L.replaceChildren();
  depts.forEach((d,i)=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="row"><div><label>שם המחלקה</label><input class="n" maxlength="30"></div></div>
      <label class="hubl"><input type="checkbox" class="hub"> 📞 מקבל קריאות ממחלקות אחרות (מוקד)</label>
      <div style="margin-top:10px"><label>קוד</label><input class="code" inputmode="numeric" maxlength="30" placeholder="הקלידו קוד קיים או צרו חדש"></div>
      <div class="btns"><button type="button" class="copy">📋 העתקה</button><button type="button" class="g wa">וואטסאפ</button><button type="button" class="y nc">🔄 קוד חדש</button><button type="button" class="r del">מחיקה</button></div>`;
    const n=c.querySelector(".n"),code=c.querySelector(".code");
    n.value=d.n;code.value=pretty(d.code);if(!d.code)code.placeholder="הקלידו את הקוד הקיים של המחלקה ושמרו";const hb=c.querySelector(".hub");hb.checked=!!d.hub;hb.onchange=()=>{d.hub=hb.checked;mark()};
    n.oninput=()=>{d.n=n.value;mark()};
    code.oninput=()=>{d.code=code.value.replace(/[\s-]/g,"");mark()};
    c.querySelector(".copy").onclick=async()=>{if(!d.code)return setMsg("אין קוד להעתקה","err");try{await navigator.clipboard.writeText(shareText(d));setMsg("הועתק: "+d.n,"ok")}catch(e){prompt("העתיקו:",shareText(d))}};
    c.querySelector(".wa").onclick=()=>{if(!d.code)return setMsg("אין קוד לשליחה","err");if(dirty)return setMsg("קודם שומרים, ואז שולחים","err");window.open("https://wa.me/?text="+encodeURIComponent(shareText(d)),"_blank","noopener")};
    c.querySelector(".nc").onclick=()=>{if(d.code&&!confirm("ליצור קוד חדש ל"+d.n+"?\nהקוד הישן יפסיק לעבוד אחרי השמירה."))return;d.code=newCode();code.value=pretty(d.code);mark()};
    c.querySelector(".del").onclick=()=>{if(!confirm("למחוק את "+d.n+"?"))return;depts.splice(i,1);render();mark()};
    L.appendChild(c);
  });
}
async function enter(){
  try{const j=await call({action:"list"});depts=j.depts.map(d=>Object.assign(d,{orig:d.code}));try{sessionStorage.setItem("mirs-admin",pw)}catch(e){}
    $("login").hidden=true;$("panel").hidden=false;$("bar").hidden=false;render();dirty=false;setMsg("")}
  catch(e){$("loginMsg").textContent=e.message;$("loginMsg").className="hint warn";pw="";try{sessionStorage.removeItem("mirs-admin")}catch(_){}}
}
$("login").onsubmit=e=>{e.preventDefault();pw=$("pw").value;$("loginMsg").textContent="בודק…";$("loginMsg").className="hint";enter()};
$("add").onclick=()=>{depts.push({id:"",n:"מחלקה חדשה",code:newCode()});render();mark();$("list").lastElementChild.querySelector(".n").select()};
// fingerprint + one-way proof are computed here, so the server never runs the slow PBKDF2 (must match index.html)
const TE=new TextEncoder(),hex=a=>Array.from(a,b=>b.toString(16).padStart(2,"0")).join("");
const FINALS={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const normCode=v=>String(v||"").toLowerCase().replace(/[ךםןףץ]/g,c=>FINALS[c]).replace(/[^a-z0-9\u05d0-\u05ea]/g,"").slice(0,30);
async function proofOf(code){const base=await crypto.subtle.importKey("raw",TE.encode(code),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:TE.encode("mirs-channel-v3"),iterations:150000,hash:"SHA-256"},base,512));
  const pre=TE.encode("mirs-proof-v1|"),buf=new Uint8Array(pre.length+32);buf.set(pre);buf.set(bits.slice(0,32),pre.length);
  return {t:hex(bits.slice(56,64)),v:hex(new Uint8Array(await crypto.subtle.digest("SHA-256",buf)))}}
$("save").onclick=async()=>{$("save").disabled=true;setMsg("שומר…");
  try{const send=[];let k=0;for(const d of depts){const c=normCode(d.code),x={id:d.id,n:d.n,code:d.code,hub:!!d.hub};k++;
      if(c.length>=6&&!(d.proof&&d.code===d.orig)){setMsg("מכין קוד מאובטח "+k+"/"+depts.length+"…");Object.assign(x,await proofOf(c))}send.push(x)}
    setMsg("שומר…");
    const j=await call({action:"save",depts:send});depts=j.depts.map(d=>Object.assign(d,{orig:d.code}));render();dirty=false;setMsg("נשמר ✓","ok")}catch(e){setMsg(e.message||String(e),"err")}
  $("save").disabled=false};
$("logout").onclick=()=>{try{sessionStorage.removeItem("mirs-admin")}catch(e){}location.reload()};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
if(pw)enter();
</script>
</body>
</html>
